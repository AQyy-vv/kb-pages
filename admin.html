<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>知识库内容迭代审核</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Microsoft YaHei",sans-serif;background:#f5f6f8;padding:16px 12px;color:#222}
.wrap{max-width:820px;margin:0 auto}
.tabs{display:flex;gap:6px;background:#fff;border-radius:12px;padding:6px;box-shadow:0 2px 12px rgba(0,0,0,.06);margin-bottom:16px;position:sticky;top:8px;z-index:30}
.tab{flex:1;text-align:center;padding:11px 8px;border-radius:9px;font-size:14px;font-weight:600;color:#666;cursor:pointer;position:relative;white-space:nowrap}
.tab.active{background:#1677ff;color:#fff}
.tab .badge{background:#e5484d;color:#fff;font-size:11px;border-radius:20px;padding:0 6px;margin-left:4px;display:none}
.tab .badge.show{display:inline-block}
.tab.active .badge{background:#fff;color:#e5484d}
.page{display:none}
.page.active{display:block}
.card{background:#fff;border-radius:14px;box-shadow:0 2px 18px rgba(0,0,0,.08);padding:24px 20px}
h3{margin-bottom:4px}
.sub{color:#999;font-size:13px;margin-bottom:18px}
.g{margin-bottom:16px}
label{display:block;font-size:14px;font-weight:600;margin-bottom:6px}
label .req{color:#ff4d4f;margin-left:3px}
input,select,textarea{width:100%;padding:10px 12px;border:1px solid #dcdfe6;border-radius:9px;font-size:14px;font-family:inherit;background:#fff}
textarea{min-height:90px;resize:vertical}
select:focus,input:focus,textarea:focus{outline:none;border-color:#1677ff;box-shadow:0 0 0 3px rgba(22,119,255,.12)}
.hint{font-size:12px;color:#aaa;margin-top:5px;line-height:1.6}
.btn{width:100%;margin-top:8px;padding:12px;border:0;border-radius:9px;background:#1677ff;color:#fff;font-size:15px;font-weight:600;cursor:pointer}
.btn:disabled{background:#a9c9ff;cursor:not-allowed}
.btn.sm{width:auto;padding:9px 16px;margin-top:0;font-size:14px}
.btn.gray{background:#6b7280}
.msg{margin-top:14px;font-size:14px;text-align:center;line-height:1.7;display:none}
.msg.ok{color:#12a150}.msg.err{color:#e5484d}
.idbox{margin-top:12px;background:#f0fff4;border:1px solid #b7ebc6;border-radius:9px;padding:12px;font-size:14px;text-align:center;display:none}
.idbox b{font-size:16px;color:#12a150;letter-spacing:1px}
.chapterwrap{position:relative}
.dropdown{position:absolute;left:0;right:0;top:100%;background:#fff;border:1px solid #dcdfe6;border-top:0;border-radius:0 0 9px 9px;max-height:230px;overflow:auto;z-index:20;display:none}
.dropdown div{padding:9px 12px;font-size:14px;cursor:pointer;border-bottom:1px solid #f2f2f2}
.dropdown div:hover{background:#f0f6ff}
.item{border:1px solid #eee;border-radius:10px;padding:14px 14px 4px;margin-bottom:14px;position:relative;background:#fafbfc}
.item .idx{position:absolute;top:10px;right:12px;font-size:12px;color:#bbb}
.item .del{position:absolute;top:8px;right:12px;color:#e5484d;font-size:13px;cursor:pointer;display:none}
.item:hover .del{display:inline}.item:hover .idx{display:none}
.addbtn{width:100%;padding:10px;border:1px dashed #1677ff;border-radius:9px;background:#f5f9ff;color:#1677ff;font-size:14px;cursor:pointer;margin-bottom:16px}
.bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.bar input,.bar select{flex:0 0 auto;width:auto}
.bar .grow{flex:1;min-width:140px}
.empty{text-align:center;color:#999;padding:36px 0}
.gmsg{text-align:center;font-size:14px;margin:10px 0;display:none}
.gmsg.ok{color:#12a150}.gmsg.err{color:#e5484d}
.badge2{display:inline-block;padding:4px 14px;border-radius:20px;color:#fff;font-size:14px;font-weight:600}
.badge2.pending{background:#d97706}.badge2.passed{background:#12a150}.badge2.rejected{background:#e5484d}
.row{font-size:14px;margin:6px 0;line-height:1.7}
.row b{color:#555;display:inline-block;min-width:64px}
.chg{border:1px solid #eee;border-radius:9px;padding:10px 12px;margin:8px 0}
.chg .h{font-size:13px;font-weight:600;margin-bottom:6px}
.tag{display:inline-block;padding:1px 8px;border-radius:20px;font-size:12px;color:#fff;margin-left:6px}
.tag.add{background:#12a150}.tag.replace{background:#1677ff}.tag.delete{background:#e5484d}
.diff .old,.diff .new{padding:7px 10px;font-size:13px;line-height:1.7;white-space:pre-wrap;word-break:break-all;border-radius:6px}
.diff .old{background:#fff5f5;color:#8a1f1f;margin-bottom:4px}
.diff .new{background:#f2fff6;color:#155e2e}
.acts{display:flex;gap:10px;margin-top:12px;flex-wrap:wrap}
.acts input{flex:1;min-width:160px}
.pass,.reject{padding:9px 18px;border:0;border-radius:9px;color:#fff;font-size:14px;font-weight:600;cursor:pointer}
.pass{background:#12a150}.reject{background:#e5484d}
.rec{background:#fff;border:1px solid #eee;border-radius:12px;padding:16px;margin-bottom:14px}
.rec .head{display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;margin-bottom:8px}
.res{padding:2px 10px;border-radius:20px;font-size:13px;color:#fff}
.res.passed{background:#12a150}.res.rejected{background:#e5484d}
.stats{display:flex;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.stat{flex:1;min-width:90px;background:#fff;border:1px solid #eee;border-radius:12px;padding:12px;text-align:center}
.stat .n{font-size:22px;font-weight:700}.stat .l{font-size:12px;color:#888}
.stat.all .n{color:#1677ff}.stat.pass .n{color:#12a150}.stat.reject .n{color:#e5484d}
.stat.today .n{color:#7c3aed}
.lock{text-align:center;padding:30px 10px}
.lock input{max-width:280px;margin:12px auto}
.muted{color:#999;font-size:12px}
.chart{width:100%;overflow-x:auto;margin-bottom:12px}
svg text{font-size:11px;fill:#888}
.bars .bar2{display:flex;align-items:center;gap:8px;margin-bottom:6px;font-size:13px}
.bars .lbl{width:96px;text-align:right;color:#555;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bars .track{flex:1;background:#eef0f3;border-radius:6px;height:16px}
.bars .fill{height:100%;border-radius:6px;background:#1677ff}
.bars .val{width:30px;font-weight:600}
</style>
</head>

<body>
<div class="wrap">
  <div class="tabs">
    <div class="tab active" data-tab="review">审核<span class="badge" id="tabBadge">0</span></div>
    <div class="tab" data-tab="audit">迭代记录</div>
  </div>

  <!-- 审核(口令) -->
  <div class="page active" id="page-review">
    <div class="card">
      <div id="reviewLock" class="lock">
        <h3>审核区需要口令</h3>
        <div class="sub">请输入审核口令进入（未设置口令可直接进入）</div>
        <input id="lockKey" type="password" placeholder="审核口令">
        <button class="btn" id="unlockBtn" style="max-width:280px;margin:0 auto">进入审核</button>
        <div class="gmsg" id="lockMsg"></div>
      </div>
      <div id="reviewArea" style="display:none">
        <div class="bar">
          <h3 style="flex:1">待审申请</h3>
          <input class="grow" id="reviewer" placeholder="审核人姓名">
          <button class="btn sm" id="refresh">刷新</button>
          <button class="btn sm gray" id="lockBtn">锁定</button>
        </div>
        <div class="gmsg" id="rmsg"></div>
        <div id="reviewList"><div class="empty">加载中…</div></div>
      </div>
    </div>
  </div>

  <!-- 迭代记录 -->
  <div class="page" id="page-audit">
    <div class="card">
      <h3>知识库内容迭代记录</h3>
      <div class="sub">审批留底与统计看板</div>
      <div class="stats">
        <div class="stat all"><div class="n" id="s_all">-</div><div class="l">总记录</div></div>
        <div class="stat pass"><div class="n" id="s_pass">-</div><div class="l">已通过</div></div>
        <div class="stat reject"><div class="n" id="s_reject">-</div><div class="l">已驳回</div></div>
        <div class="stat today"><div class="n" id="s_today">-</div><div class="l">今日</div></div>
      </div>
      <div class="bar">
        <input class="grow" id="kw" placeholder="关键词：编号/提交人/章节/内容…">
        <select id="result"><option value="">全部结果</option><option value="passed">仅通过</option><option value="rejected">仅驳回</option></select>
        <label class="muted">从</label><input id="dfrom" type="date" style="width:auto">
        <label class="muted">到</label><input id="dto" type="date" style="width:auto">
        <button class="btn sm" id="auditQuery">查询</button>
        <button class="btn sm gray" id="auditExport">导出CSV</button>
      </div>
      <div class="muted" style="margin-bottom:6px">审核趋势（近 <span id="trendDays">14</span> 天）
        <select id="trendSel" style="width:auto;padding:3px 6px;margin-left:6px"><option value="7">7天</option><option value="14" selected>14天</option><option value="30">30天</option></select></div>
      <div class="chart" id="trend"></div>
      <div style="display:flex;gap:20px;flex-wrap:wrap">
        <div style="flex:1;min-width:220px"><div class="muted">操作类型</div><div class="bars" id="dOp"></div></div>
        <div style="flex:1;min-width:220px"><div class="muted">章节 Top</div><div class="bars" id="dChapter"></div></div>
      </div>
      <div style="display:flex;gap:20px;flex-wrap:wrap;margin-top:10px">
        <div style="flex:1;min-width:220px"><div class="muted">提交人榜</div><div class="bars" id="dApplicant"></div></div>
        <div style="flex:1;min-width:220px"><div class="muted">审核人榜</div><div class="bars" id="dReviewer"></div></div>
      </div>
      <div class="gmsg" id="amsg"></div>
      <div style="margin-top:10px"><b class="muted">明细（<span id="cntShown">0</span> 条）</b></div>
      <div id="auditList"><div class="empty">点击「查询」加载</div></div>
    </div>
  </div>
</div>

<script>
var API = "https://1447704904-fkpw4as6i9.ap-guangzhou.tencentscf.com";
var AUTH_KEY = "mySecretAuthKey2024";
var CHAPTERS_URL = "https://kb-docs-1234567890-1447704904.cos.ap-guangzhou.myqcloud.com/chapters.json";
var $ = function(id){return document.getElementById(id);};
function esc(s){ return (s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
function flash(el, t, ok){ el.className="gmsg "+(ok?"ok":"err"); el.textContent=t; el.style.display="block"; setTimeout(function(){el.style.display="none";},4000); }
function pad(n){ return n<10?("0"+n):(""+n); }
function fmtDate(d){ return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate()); }
function post(payload){ return fetch(API,{method:"POST",headers:{"Content-Type":"application/json; charset=utf-8"},body:JSON.stringify(payload)}).then(function(r){return r.json();}); }
// ---- Tab 切换 ----
var reviewUnlocked=false;
Array.prototype.forEach.call(document.querySelectorAll(".tab"),function(t){
  t.onclick=function(){
    var name=t.getAttribute("data-tab");
    Array.prototype.forEach.call(document.querySelectorAll(".tab"),function(x){x.classList.remove("active");});
    Array.prototype.forEach.call(document.querySelectorAll(".page"),function(x){x.classList.remove("active");});
    t.classList.add("active"); $("page-"+name).classList.add("active");
    if(name==="audit"){ if(reviewUnlocked) auditQuery(); else { $("amsg").className="gmsg err"; $("amsg").textContent="请先在「审核」标签输入口令解锁后再查看记录"; $("amsg").style.display="block"; } }
    if(name==="review" && reviewUnlocked) loadReview();
  };
});
// ================= 审核(口令) =================
var reviewTimer=null;
function unlock(){ reviewUnlocked=true; window.__reviewKey=$("lockKey").value.trim(); $("reviewLock").style.display="none"; $("reviewArea").style.display="block"; loadReview(); if(reviewTimer) clearInterval(reviewTimer); reviewTimer=setInterval(function(){ if(reviewUnlocked && $("page-review").classList.contains("active")) loadReview(); },60000); }
function lock(){ reviewUnlocked=false; window.__reviewKey=""; $("reviewArea").style.display="none"; $("reviewLock").style.display="block"; $("lockKey").value=""; if(reviewTimer) clearInterval(reviewTimer); }
$("unlockBtn").onclick=function(){ var rk=$("lockKey").value.trim(); post({auth_key:AUTH_KEY,action:"list",review_key:rk}).then(function(res){ if(res.code!==0){ flash($("lockMsg"),res.msg||"口令错误或无权限",false); return; } unlock(); renderReview(res.data||[], res.count); }).catch(function(e){ flash($("lockMsg"),"网络错误："+e,false); }); };
$("lockBtn").onclick=lock; $("lockKey").addEventListener("keydown",function(e){ if(e.key==="Enter") $("unlockBtn").click(); });
function setTabBadge(n){ var b=$("tabBadge"); if(n>0){ b.textContent=n; b.classList.add("show"); } else { b.classList.remove("show"); } }
function loadReview(){ post({auth_key:AUTH_KEY,action:"list",review_key:window.__reviewKey||""}).then(function(res){ if(res.code!==0){ flash($("rmsg"),res.msg||"加载失败",false); return; } renderReview(res.data||[], res.count); }).catch(function(e){ flash($("rmsg"),"网络错误："+e,false); }); }
function reviewItemsHtml(it){ var arr=it.items||[{field:it.field,op:it.op,op_label:it.op_label,preview_old:it.preview_old,preview_new:it.preview_new,preview_note:it.preview_note}]; return arr.map(function(x){ return "<div class=\"chg\"><div class=\"h\">"+esc(x.field)+"<span class=\"tag "+x.op+"\">"+esc(x.op_label||x.op)+"</span><span style=\"color:#aaa;font-weight:400;margin-left:6px\">"+esc(x.preview_note||"")+"</span></div><div class=\"diff\"><div class=\"old\">改前："+esc(x.preview_old||"(空)")+"</div><div class=\"new\">改后："+esc(x.preview_new||"(空)")+"</div></div></div>"; }).join(""); }
function renderReview(list, count){ setTabBadge(count!=null?count:list.length); var box=$("reviewList"); if(!list.length){ box.innerHTML="<div class=\"empty\">🎉 暂无待审申请</div>"; return; } box.innerHTML="";
  list.forEach(function(it){ var div=document.createElement("div"); div.className="rec"; var cnt=(it.items?it.items.length:1);
    div.innerHTML="<div class=\"row\"><b>编号</b>"+esc(it.id)+"　<span style=\"color:#aaa\">"+esc(it.created_time||"")+"</span></div>"+
      "<div class=\"row\"><b>提交人</b>"+esc(it.applicant)+"</div>"+
      "<div class=\"row\"><b>章节</b>"+esc(it.chapter_title)+"　<span style=\"color:#1677ff\">共 "+cnt+" 项修改</span></div>"+
      reviewItemsHtml(it)+
      "<div class=\"acts\"><input placeholder=\"驳回理由（驳回时填写）\" id=\"reason_"+it.id+"\"><button class=\"pass\" data-id=\""+it.id+"\" data-dec=\"pass\">全部通过</button><button class=\"reject\" data-id=\""+it.id+"\" data-dec=\"reject\">驳回</button></div>";
    box.appendChild(div); });
  Array.prototype.forEach.call(document.querySelectorAll(".pass,.reject"),function(btn){ btn.onclick=function(){ doReviewAction(btn.getAttribute("data-id"), btn.getAttribute("data-dec")); }; }); }
function doReviewAction(id, decision){ var reviewer=$("reviewer").value.trim()||"审核人"; var reason=(document.getElementById("reason_"+id)||{}).value||""; if(decision==="reject" && !reason.trim()){ if(!confirm("未填写驳回理由，确定驳回？")) return; }
  post({auth_key:AUTH_KEY,action:"review",review_key:window.__reviewKey||"",id:id,decision:decision,reviewer:reviewer,reason:reason}).then(function(res){ flash($("rmsg"),(res.code===0?"✅ ":"❌ ")+res.msg, res.code===0); if(res.code===0) loadReview(); }).catch(function(e){ flash($("rmsg"),"网络错误："+e,false); }); }
$("refresh").onclick=loadReview;
// ================= 迭代记录看板 =================
var auditAll=[], auditView=[];
function recDate(r){ var s=(r.review_time||"").trim(); return s.length>=10?s.substr(0,10):""; }
function auditQuery(){ post({auth_key:AUTH_KEY,action:"audit",review_key:window.__reviewKey||"",keyword:$("kw").value.trim(),result:$("result").value}).then(function(res){ if(res.code!==0){ flash($("amsg"),res.msg||"查询失败",false); return; } var st=res.stat||{}; $("s_all").textContent=st.all!=null?st.all:"-"; $("s_pass").textContent=st.passed!=null?st.passed:"-"; $("s_reject").textContent=st.rejected!=null?st.rejected:"-"; auditAll=res.data||[]; auditApplyDate(); }).catch(function(e){ flash($("amsg"),"网络错误："+e,false); }); }
function auditApplyDate(){ var from=$("dfrom").value, to=$("dto").value; auditView=auditAll.filter(function(r){ var d=recDate(r); if(!d) return true; if(from&&d<from) return false; if(to&&d>to) return false; return true; });
  var today=fmtDate(new Date()), tN=0; auditAll.forEach(function(r){ if(recDate(r)===today) tN++; }); $("s_today").textContent=tN;
  renderTrend(); renderDist(); renderAuditList(); }
function renderTrend(){ var days=parseInt($("trendSel").value)||14; $("trendDays").textContent=days; var labels=[],mp={},mr={}; for(var i=days-1;i>=0;i--){ var d=new Date(); d.setDate(d.getDate()-i); var k=fmtDate(d); labels.push(k); mp[k]=0; mr[k]=0; } auditAll.forEach(function(r){ var k=recDate(r); if(k in mp){ if(r.result==="passed") mp[k]++; else if(r.result==="rejected") mr[k]++; } }); var maxV=1; labels.forEach(function(k){ var t=mp[k]+mr[k]; if(t>maxV) maxV=t; });
  var W=Math.max(560,labels.length*40),H=170,padL=26,padB=38,padT=8,innerH=H-padB-padT,bw=(W-padL-10)/labels.length;
  var svg="<svg width=\""+W+"\" height=\""+H+"\" viewBox=\"0 0 "+W+" "+H+"\">";
  for(var g=0;g<=4;g++){ var yy=padT+innerH*g/4; var vv=Math.round(maxV*(4-g)/4); svg+="<line x1=\""+padL+"\" y1=\""+yy+"\" x2=\""+W+"\" y2=\""+yy+"\" stroke=\"#eef0f3\"/><text x=\"2\" y=\""+(yy+4)+"\">"+vv+"</text>"; }
  labels.forEach(function(k,idx){ var x=padL+idx*bw+4, w=Math.max(6,bw-10); var p=mp[k],rj=mr[k]; var hp=innerH*p/maxV,hr=innerH*rj/maxV; var yP=padT+innerH-hp,yR=yP-hr; svg+="<rect x=\""+x+"\" y=\""+yP+"\" width=\""+w+"\" height=\""+hp+"\" fill=\"#12a150\"><title>"+k+" 通过 "+p+"</title></rect><rect x=\""+x+"\" y=\""+yR+"\" width=\""+w+"\" height=\""+hr+"\" fill=\"#e5484d\"><title>"+k+" 驳回 "+rj+"</title></rect><text x=\""+(x+w/2)+"\" y=\""+(H-padB+15)+"\" text-anchor=\"middle\">"+k.substr(5)+"</text>"; });
  svg+="</svg><div class=\"muted\" style=\"margin-top:4px\"><span style=\"color:#12a150\">■</span> 通过　<span style=\"color:#e5484d\">■</span> 驳回</div>"; $("trend").innerHTML=svg; }
function drawBars(el, mapObj, limit){ var arr=Object.keys(mapObj).map(function(k){return [k,mapObj[k]];}).sort(function(a,b){return b[1]-a[1];}); if(limit) arr=arr.slice(0,limit); var max=1; arr.forEach(function(x){ if(x[1]>max) max=x[1]; }); if(!arr.length){ el.innerHTML="<div class=\"muted\">无数据</div>"; return; } el.innerHTML=arr.map(function(x){ var pct=Math.round(x[1]/max*100); return "<div class=\"bar2\"><span class=\"lbl\" title=\""+esc(x[0])+"\">"+esc(x[0])+"</span><span class=\"track\"><span class=\"fill\" style=\"width:"+pct+"%\"></span></span><span class=\"val\">"+x[1]+"</span></div>"; }).join(""); }
function renderDist(){ var opM={},chM={},apM={},rvM={}; auditView.forEach(function(r){ var arr=r.items||[{op_label:r.op_label,op:r.op}]; arr.forEach(function(x){ var l=x.op_label||x.op||"(未知)"; opM[l]=(opM[l]||0)+1; }); var ch=r.chapter_title||"(空)"; chM[ch]=(chM[ch]||0)+1; var ap=r.applicant||"(空)"; apM[ap]=(apM[ap]||0)+1; var rv=r.reviewer||"(空)"; rvM[rv]=(rvM[rv]||0)+1; }); drawBars($("dOp"),opM,0); drawBars($("dChapter"),chM,8); drawBars($("dApplicant"),apM,8); drawBars($("dReviewer"),rvM,8); }
function auditItems(r){ var arr=r.items||[{field:r.field,op:r.op,op_label:r.op_label,content:r.content,old_value:r.old_value,new_value:r.new_value}]; return arr.map(function(x){ var extra=""; if(r.result==="passed"){ extra=" <span style=\"color:#8a1f1f\">改前:"+esc(String(x.old_value||"(空)").slice(0,40))+"</span> → <span style=\"color:#155e2e\">改后:"+esc(String(x.new_value||"(空)").slice(0,40))+"</span>"; } return "<div class=\"chg\">"+esc(x.field)+"<span class=\"tag "+x.op+"\">"+esc(x.op_label||x.op)+"</span>："+esc(x.content||"(删除整行)")+extra+"</div>"; }).join(""); }
function renderAuditList(){ var box=$("auditList"); $("cntShown").textContent=auditView.length; if(!auditView.length){ box.innerHTML="<div class=\"empty\">无匹配记录</div>"; return; } box.innerHTML=""; auditView.forEach(function(r){ var div=document.createElement("div"); div.className="rec"; var rl=r.result==="passed"?"已通过":(r.result==="rejected"?"已驳回":r.result); div.innerHTML="<div class=\"head\"><span style=\"font-weight:600\">"+esc(r.id)+"</span><span class=\"res "+esc(r.result)+"\">"+rl+"</span></div><div class=\"row\"><b>提交人</b>"+esc(r.applicant)+"　<b>审核人</b>"+esc(r.reviewer)+"</div><div class=\"row\"><b>章节</b>"+esc(r.chapter_title)+"</div><div class=\"row\"><b>审核时间</b>"+esc(r.review_time)+"</div>"+auditItems(r)+(r.result==="rejected"&&r.reason?("<div class=\"row\" style=\"color:#e5484d\">驳回理由："+esc(r.reason)+"</div>"):""); box.appendChild(div); }); }
function auditExport(){ if(!auditView.length){ flash($("amsg"),"无数据可导出",false); return; } var rows=[["编号","结果","提交人","审核人","章节","审核时间","字段","操作","内容","驳回理由"]]; auditView.forEach(function(r){ var arr=r.items||[{field:r.field,op_label:r.op_label,content:r.content}]; arr.forEach(function(x){ rows.push([r.id,r.result,r.applicant,r.reviewer,r.chapter_title,r.review_time,x.field,(x.op_label||x.op),x.content,(r.reason||"")]); }); }); var csv=rows.map(function(row){return row.map(function(c){return "\""+String(c==null?"":c).replace(/"/g,"\"\"")+"\"";}).join(",");}).join("\r\n"); var blob=new Blob(["\ufeff"+csv],{type:"text/csv;charset=utf-8"}); var a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download="知识库迭代记录_"+Date.now()+".csv"; a.click(); }
$("auditQuery").onclick=auditQuery; $("auditExport").onclick=auditExport; $("trendSel").onchange=renderTrend; $("dfrom").onchange=auditApplyDate; $("dto").onchange=auditApplyDate; $("kw").addEventListener("keydown",function(e){ if(e.key==="Enter") auditQuery(); });
</script>
